name: Build & Push Docker Image

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - 'README.md'
      - 'LICENSE'
      - '.github/workflows/sync-upstream.yml'
      - 'docs/**'
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # ── 1. 各平台原生构建 ──────────────────────────────────
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            suffix: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            suffix: arm64

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Short SHA
        id: sha
        run: echo "value=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            coldsword/nodeget-theme-abyssal:${{ steps.sha.outputs.value }}-${{ matrix.suffix }}
            ghcr.io/${{ github.repository_owner }}/nodeget-theme-abyssal:${{ steps.sha.outputs.value }}-${{ matrix.suffix }}

  # ── 2. 合并多架构 manifest ────────────────────────────
  merge:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Short SHA
        id: sha
        run: echo "value=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge manifests (DockerHub)
        run: |
          IMAGE="coldsword/nodeget-theme-abyssal"
          SHA="${{ steps.sha.outputs.value }}"
          VERSION=""

          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          fi

          TAGS="-t ${IMAGE}:latest -t ${IMAGE}:${SHA}"
          [ -n "$VERSION" ] && TAGS="$TAGS -t ${IMAGE}:${VERSION}"

          docker buildx imagetools create \
            $TAGS \
            ${IMAGE}:${SHA}-amd64 \
            ${IMAGE}:${SHA}-arm64

      - name: Merge manifests (GHCR)
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/nodeget-theme-abyssal"
          SHA="${{ steps.sha.outputs.value }}"
          VERSION=""

          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          fi

          TAGS="-t ${IMAGE}:latest -t ${IMAGE}:${SHA}"
          [ -n "$VERSION" ] && TAGS="$TAGS -t ${IMAGE}:${VERSION}"

          docker buildx imagetools create \
            $TAGS \
            ${IMAGE}:${SHA}-amd64 \
            ${IMAGE}:${SHA}-arm64
