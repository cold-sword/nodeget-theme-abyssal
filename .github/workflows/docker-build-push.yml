name: Build & Push Docker Image

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'LICENSE'
      - '.github/workflows/sync-upstream.yml'
      - 'docs/**'
  schedule:
    - cron: '0 2 * * *'   # UTC 02:00 daily, after sync-upstream (UTC 00:00)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ── 1. 各平台原生构建 ──────────────────────────────────
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            suffix: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            suffix: arm64

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: coldsword/nodeget-theme-abyssal
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            coldsword/nodeget-theme-abyssal:${{ steps.meta.outputs.version }}-${{ matrix.suffix }}
            coldsword/nodeget-theme-abyssal:${{ matrix.suffix }}

  # ── 2. 合并多架构 manifest ────────────────────────────
  merge:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: coldsword/nodeget-theme-abyssal
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest

      - name: Merge manifest
        run: |
          IMAGE="coldsword/nodeget-theme-abyssal"
          TAG="${{ steps.meta.outputs.version }}"
          docker buildx imagetools create \
            -t ${IMAGE}:latest \
            -t ${IMAGE}:${TAG} \
            ${IMAGE}:${TAG}-amd64 \
            ${IMAGE}:${TAG}-arm64
