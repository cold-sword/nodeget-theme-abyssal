name: SEO – Google Indexing

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  notify-google:
    runs-on: ubuntu-latest
    steps:
      - name: Install cryptography
        run: pip install cryptography

      - name: Notify Google Indexing API
        env:
          GSC_SA_KEY: ${{ secrets.GSC_SA_KEY }}
          INDEXING_URLS: ${{ vars.INDEXING_URLS || 'https://nodeget.li/' }}
        run: |
          import json, os, sys, time, base64, hashlib, hmac, urllib.request, urllib.error

          sa = json.loads(os.environ["GSC_SA_KEY"])

          # Build JWT
          header = base64.urlsafe_b64encode(json.dumps({"alg":"RS256","typ":"JWT"}).encode()).rstrip(b"=").decode()
          now = int(time.time())
          claim = base64.urlsafe_b64encode(json.dumps({
              "iss": sa["client_email"],
              "scope": "https://www.googleapis.com/auth/indexing",
              "aud": sa["token_uri"],
              "exp": now + 3600,
              "iat": now,
          }).encode()).rstrip(b"=").decode()

          msg = f"{header}.{claim}".encode()
          from cryptography.hazmat.primitives import serialization, hashes
          from cryptography.hazmat.primitives.asymmetric import padding
          pkey = serialization.load_pem_private_key(sa["private_key"].encode(), password=None)
          sig = pkey.sign(msg, padding.PKCS1v15(), hashes.SHA256())
          jwt = f"{header}.{claim}.{base64.urlsafe_b64encode(sig).rstrip(b'=').decode()}"

          # Exchange JWT for access token
          body = urllib.parse.urlencode({
              "grant_type": "urn:ietf:params:oauth:grant-type:jwt-bearer",
              "assertion": jwt,
          }).encode()
          req = urllib.request.Request(sa["token_uri"], data=body)
          resp = urllib.request.urlopen(req)
          token = json.loads(resp.read())["access_token"]

          # Call Indexing API
          urls = os.environ["INDEXING_URLS"].split(",")
          ok = fail = 0
          for url in urls:
              url = url.strip()
              body = json.dumps({"url": url, "type": "URL_UPDATED"}).encode()
              req = urllib.request.Request(
                  "https://indexing.googleapis.com/v3/urlNotifications:publish",
                  method="POST", data=body,
                  headers={"Authorization": f"Bearer {token}", "Content-Type": "application/json"},
              )
              try:
                  resp = urllib.request.urlopen(req)
                  data = json.loads(resp.read())
                  ts = data.get("urlNotificationMetadata",{}).get("latestUpdate",{}).get("notifyTime","OK")
                  print(f"✅ {url} — {ts}")
                  ok += 1
              except urllib.error.HTTPError as e:
                  err = json.loads(e.read()).get("error",{}).get("message", str(e))
                  print(f"❌ {url} — {err}")
                  fail += 1

          print(f"\nDone: {ok} ok, {fail} failed")
          sys.exit(1 if fail > 0 else 0)
        shell: python
