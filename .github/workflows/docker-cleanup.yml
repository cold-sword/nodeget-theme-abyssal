name: Docker Image Cleanup

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  schedule:
    - cron: '0 3 * * 0'   # 每周日 UTC 03:00
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  cleanup-dockerhub:
    runs-on: ubuntu-latest
    steps:
      - name: Login to DockerHub
        run: |
          TOKEN=$(curl -s -H "Content-Type: application/json" \
            -d '{"username":"${{ secrets.DOCKERHUB_USERNAME }}","password":"${{ secrets.DOCKERHUB_TOKEN }}"}' \
            https://hub.docker.com/v2/users/login/ | jq -r '.token')
          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "⚠️ DockerHub login failed"
            exit 0
          fi
          echo "TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Cleanup DockerHub tags
        run: |
          IMAGE="coldsword/nodeget-theme-abyssal"

          # 获取所有 tags 并按时间排序
          ALL_TAGS=$(curl -s -H "Authorization: JWT $TOKEN" \
            "https://hub.docker.com/v2/repositories/${IMAGE}/tags/?page_size=100" | \
            jq -r '.results[] | "\(.name)\t\(.last_updated)"' | sort -t$'\t' -k2 -r)

          echo "$ALL_TAGS" > /tmp/all_tags.txt

          # 只保留: latest + 发布版本号(如1.4.3) + 最新的 version-sha(如1.4.3-xxx)
          # 其余全部删除
          KEEP_NOW=true   # 标记"下一个 version-sha 保留"
          TO_DELETE=()

          while IFS=$'\t' read -r name updated; do
            [ -z "$name" ] && continue

            case "$name" in
              latest)
                echo "  📌 KEEP latest"
                continue
                ;;
            esac

            # 纯净版本号 (如 1.4.3) — 永久保留
            if echo "$name" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "  🏷  KEEP $name (release)"
              continue
            fi

            # 最新的 version-sha (如 1.4.3-abc1234) — 保留一个
            if echo "$name" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+-[0-9a-f]{7,}$'; then
              if [ "$KEEP_NOW" = "true" ]; then
                echo "  🔖 KEEP $name (latest dev build)"
                KEEP_NOW=false
                continue
              fi
            fi

            # 其余一律删除
            TO_DELETE+=("$name")
          done < /tmp/all_tags.txt

          echo ""
          echo "=== 删除 ${#TO_DELETE[@]} 个 tag ==="
          for t in "${TO_DELETE[@]}"; do
            echo "  ❌ $t"
            RESULT=$(curl -s -w "%{http_code}" -X DELETE \
              -H "Authorization: JWT $TOKEN" \
              "https://hub.docker.com/v2/repositories/${IMAGE}/tags/${t}/")
            HTTP_CODE="${RESULT: -3}"
            if [ "$HTTP_CODE" != "204" ]; then
              echo "     ⚠️  HTTP $HTTP_CODE — token 可能缺少删除权限"
            fi
          done

          echo ""
          echo "✅ DockerHub cleanup done"

  cleanup-ghcr:
    runs-on: ubuntu-latest
    steps:
      - name: Cleanup GHCR tags
        run: |
          PACKAGE_URL="https://api.github.com/users/${{ github.repository_owner }}/packages/container/nodeget-theme-abyssal/versions?per_page=100"
          VERSIONS=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" "$PACKAGE_URL")

          if echo "$VERSIONS" | jq -e '.message' > /dev/null 2>&1; then
            echo "⚠️  GHCR API error: $(echo "$VERSIONS" | jq -r '.message')"
            exit 0
          fi

          # 提取 version id 和 tags
          echo "$VERSIONS" | jq -r '.[] | "\(.id)\t\(.metadata.container.tags | join(",") // "")"' \
            > /tmp/ghcr_versions.txt

          TO_DELETE_IDS=()
          KEEP_NOW=true
          SHA_COUNT=0

          while IFS=$'\t' read -r id tags_str; do
            [ -z "$id" ] && continue

            IFS=',' read -ra TAGS <<< "$tags_str"

            # 空 tag 的 version — 直接删除（孤儿）
            if [ ${#TAGS[@]} -eq 0 ] || ([ ${#TAGS[@]} -eq 1 ] && [ -z "${TAGS[0]}" ]); then
              TO_DELETE_IDS+=("$id")
              echo "  🧹 id=$id (orphan, no tags)"
              continue
            fi

            local_keep=false
            for tag in "${TAGS[@]}"; do
              case "$tag" in
                latest)
                  local_keep=true
                  echo "  📌 KEEP id=$id tags=${TAGS[*]}"
                  break
                  ;;
              esac

              if echo "$tag" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
                local_keep=true
                echo "  🏷  KEEP id=$id tags=${TAGS[*]} (release)"
                break
              fi

              if echo "$tag" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+-[0-9a-f]{7,}$'; then
                if [ "$KEEP_NOW" = "true" ]; then
                  local_keep=true
                  KEEP_NOW=false
                  echo "  🔖 KEEP id=$id tags=${TAGS[*]} (latest dev)"
                  break
                fi
              fi
            done

            if [ "$local_keep" = "false" ]; then
              TO_DELETE_IDS+=("$id")
              echo "  ❌ id=$id tags=${TAGS[*]}"
            fi
          done < /tmp/ghcr_versions.txt

          # 去重
          UNIQUE_IDS=($(printf '%s\n' "${TO_DELETE_IDS[@]}" | sort -u))
          echo ""
          echo "=== 删除 ${#UNIQUE_IDS[@]} 个 GHCR version ==="
          for id in "${UNIQUE_IDS[@]}"; do
            [ -z "$id" ] && continue
            RESULT=$(curl -s -w "%{http_code}" -X DELETE \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/users/${{ github.repository_owner }}/packages/container/nodeget-theme-abyssal/versions/$id")
            HTTP_CODE="${RESULT: -3}"
            if [ "$HTTP_CODE" != "204" ]; then
              echo "     ⚠️  HTTP $HTTP_CODE"
            fi
          done

          echo ""
          echo "✅ GHCR cleanup done"
