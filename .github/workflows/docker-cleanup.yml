name: Docker Image Cleanup

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  schedule:
    - cron: '0 3 * * 0'   # 每周日 UTC 03:00
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cleanup-dockerhub:
    runs-on: ubuntu-latest
    steps:
      - name: Login to DockerHub
        run: |
          TOKEN=$(curl -s -H "Content-Type: application/json" \
            -d '{"username":"${{ secrets.DOCKERHUB_USERNAME }}","password":"${{ secrets.DOCKERHUB_TOKEN }}"}' \
            https://hub.docker.com/v2/users/login/ | jq -r '.token')
          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "⚠️ DockerHub login failed"
            exit 0
          fi
          echo "TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Cleanup DockerHub tags
        run: |
          IMAGE="coldsword/nodeget-theme-abyssal"
          KEEP_SHA=10        # 保留最近 N 个纯 SHA tag
          KEEP_DEV=5         # 保留最近 N 个 version-sha tag
          KEEP_NIGHTLY=3     # 保留最近 N 个 nightly tag

          # 获取所有 tags
          ALL_TAGS=$(curl -s -H "Authorization: JWT $TOKEN" \
            "https://hub.docker.com/v2/repositories/${IMAGE}/tags/?page_size=100" | \
            jq -r '.results[] | "\(.name)\t\(.last_updated)"')

          # 按时间排序，分类
          echo "$ALL_TAGS" | sort -t$'\t' -k2 -r > /tmp/all_tags.txt

          SHA_TAGS=()
          DEV_TAGS=()
          NIGHTLY_TAGS=()
          TO_DELETE=()

          while IFS=$'\t' read -r name updated; do
            case "$name" in
              latest)
                echo "  📌 KEEP $name (latest)"
                continue
                ;;
              "")
                continue
                ;;
            esac

            if echo "$name" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "  🏷  KEEP $name (release tag)"
              continue
            elif echo "$name" | grep -qE '^[0-9a-f]{7,}$'; then
              SHA_TAGS+=("$name")
            elif echo "$name" | grep -qE '^nightly-'; then
              NIGHTLY_TAGS+=("$name")
            elif echo "$name" | grep -qE '\-(amd64|arm64)$'; then
              TO_DELETE+=("$name")   # 平台特定 tag，总删除
            elif echo "$name" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+-'; then
              DEV_TAGS+=("$name")    # version-sha (dev build)
            else
              echo "  ❓ SKIP $name (unknown pattern)"
            fi
          done < /tmp/all_tags.txt

          echo ""
          echo "=== Cleanup Plan ==="
          echo "SHA tags total: ${#SHA_TAGS[@]} → keep $KEEP_SHA"
          echo "Dev tags total: ${#DEV_TAGS[@]} → keep $KEEP_DEV"
          echo "Nightly tags total: ${#NIGHTLY_TAGS[@]} → keep $KEEP_NIGHTLY"
          echo "Platform tags to delete: ${#TO_DELETE[@]}"
          echo ""

          # 删除旧的 SHA tags
          DELETE_SHA=$(( ${#SHA_TAGS[@]} - KEEP_SHA ))
          if [ $DELETE_SHA -gt 0 ]; then
            echo "Deleting $DELETE_SHA old SHA tags..."
            for ((i=KEEP_SHA; i<${#SHA_TAGS[@]}; i++)); do
              echo "  ❌ ${SHA_TAGS[$i]}"
              curl -s -X DELETE -H "Authorization: JWT $TOKEN" \
                "https://hub.docker.com/v2/repositories/${IMAGE}/tags/${SHA_TAGS[$i]}/" > /dev/null
            done
          fi

          # 删除旧的 dev tags
          DELETE_DEV=$(( ${#DEV_TAGS[@]} - KEEP_DEV ))
          if [ $DELETE_DEV -gt 0 ]; then
            echo "Deleting $DELETE_DEV old dev tags..."
            for ((i=KEEP_DEV; i<${#DEV_TAGS[@]}; i++)); do
              echo "  ❌ ${DEV_TAGS[$i]}"
              curl -s -X DELETE -H "Authorization: JWT $TOKEN" \
                "https://hub.docker.com/v2/repositories/${IMAGE}/tags/${DEV_TAGS[$i]}/" > /dev/null
            done
          fi

          # 删除旧的 nightly tags
          DELETE_NIGHTLY=$(( ${#NIGHTLY_TAGS[@]} - KEEP_NIGHTLY ))
          if [ $DELETE_NIGHTLY -gt 0 ]; then
            echo "Deleting $DELETE_NIGHTLY old nightly tags..."
            for ((i=KEEP_NIGHTLY; i<${#NIGHTLY_TAGS[@]}; i++)); do
              echo "  ❌ ${NIGHTLY_TAGS[$i]}"
              curl -s -X DELETE -H "Authorization: JWT $TOKEN" \
                "https://hub.docker.com/v2/repositories/${IMAGE}/tags/${NIGHTLY_TAGS[$i]}/" > /dev/null
            done
          fi

          # 删除所有平台特定 tag
          for t in "${TO_DELETE[@]}"; do
            echo "  🧹 ${t} (platform intermediate)"
            curl -s -X DELETE -H "Authorization: JWT $TOKEN" \
              "https://hub.docker.com/v2/repositories/${IMAGE}/tags/${t}/" > /dev/null
          done

          echo ""
          echo "✅ DockerHub cleanup done"

  cleanup-ghcr:
    runs-on: ubuntu-latest
    steps:
      - name: Cleanup GHCR tags
        run: |
          # GHCR 使用 GitHub token 认证
          IMAGE="ghcr.io/${{ github.repository_owner }}/nodeget-theme-abyssal"
          KEEP_SHA=10

          # 获取 packages
          PACKAGE_URL="https://api.github.com/orgs/${{ github.repository_owner }}/packages/container/nodeget-theme-abyssal/versions?per_page=100"
          VERSIONS=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" "$PACKAGE_URL")

          # 获取所有 version IDs 和 tags
          echo "$VERSIONS" | jq -r '.[] | "\(.id)\t\(.metadata.container.tags[]?)"' > /tmp/ghcr_versions.txt

          # 需要删除的 IDs
          TO_DELETE_IDS=()
          SHA_COUNT=0

          while IFS=$'\t' read -r id tag; do
            [ -z "$tag" ] && continue
            case "$tag" in
              latest)
                continue
                ;;
            esac

            if echo "$tag" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              continue  # 保留 release tag
            elif echo "$tag" | grep -qE '^[0-9a-f]{7,}$'; then
              SHA_COUNT=$((SHA_COUNT + 1))
              if [ $SHA_COUNT -gt $KEEP_SHA ]; then
                TO_DELETE_IDS+=("$id")
              fi
            elif echo "$tag" | grep -qE '\-(amd64|arm64)$'; then
              TO_DELETE_IDS+=("$id")  # 平台中间产物
            fi
          done < /tmp/ghcr_versions.txt

          # 去重删除
          UNIQUE_IDS=($(printf '%s\n' "${TO_DELETE_IDS[@]}" | sort -u))
          echo "Deleting ${#UNIQUE_IDS[@]} GHCR versions..."
          for id in "${UNIQUE_IDS[@]}"; do
            echo "  ❌ GHCR version $id"
            curl -s -X DELETE -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/orgs/${{ github.repository_owner }}/packages/container/nodeget-theme-abyssal/versions/$id" > /dev/null
          done

          echo "✅ GHCR cleanup done"
