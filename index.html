<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta name="keywords" content="NodeGet,Abyssal,深海主题,探针主题,暗色UI,服务器监控主题,ColdSword,开源" />
    <meta name="author" content="ColdSword" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://nodeget.li/" />
    <link rel="icon" type="image/png" href="./logo.png" />

    <!-- Open Graph -->
    <meta property="og:title" content="NodeGet Abyssal Theme by ColdSword — 深海暗色探针主题" />
    <meta property="og:description" content="NodeGet 服务器探针暗色 UI 皮肤。自定义延迟图例排序、供应商过滤、多节点布局。开源免费。" />
    <meta property="og:url" content="https://nodeget.li/" />

    <meta property="og:image" content="https://nodeget.li/logo.png" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="NodeGet Abyssal Theme — 深海暗色探针主题" />
    <meta name="twitter:description" content="NodeGet 暗色 UI 皮肤。自定义延迟排序、供应商过滤。开源免费。" />
    <meta name="twitter:image" content="https://nodeget.li/logo.png" />

    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "NodeGet Abyssal Theme",
      "url": "https://nodeget.li/",
      "description": "NodeGet 服务器探针深海暗色主题皮肤，支持自定义延迟图例排序、供应商过滤",
      "author": { "@type": "Person", "name": "ColdSword", "url": "https://github.com/cold-sword" },
      "applicationCategory": "Theme",
      "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
    }
    </script>

    <script>
      // Prefetch config files while the browser downloads & parses the JS bundle.
      // When React mounts, useUserConfig/useThemeConfig pick up these
      // already-in-flight promises for instant resolution.
      window.__config_p__ = fetch('config.json', { cache: 'no-cache' })
        .then(function(res) { return res.ok ? res.json() : Promise.reject(new Error('config.json ' + res.status)) })
      window.__config_p__.catch(function(e) { console.debug('config.json prefetch failed:', e) })
      window.__theme_p__ = fetch('nodeget-theme.json', { cache: 'no-cache' })
        .then(function(res) { return res.ok ? res.json() : Promise.reject(new Error('nodeget-theme.json ' + res.status)) })
      window.__theme_p__.catch(function(e) { console.debug('nodeget-theme.json prefetch failed:', e) })
    </script>
    <script>
      try {
        var t = localStorage.getItem('nodeget.theme')
        if (t !== 'light') {
          document.documentElement.classList.add('dark')
        }
      } catch (_) {}
    </script>
    <link rel="stylesheet" href="./custom.css" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script src="./custom.js" defer></script>
  </body>
</html>
